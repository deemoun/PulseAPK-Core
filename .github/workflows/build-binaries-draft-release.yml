name: Build Binaries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install AppImage tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file
          curl -L https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool

      - name: Build Linux AppImage
        run: ./scripts/build-appimage.sh

      - name: Build Windows binaries
        run: OUTPUT_EXE_NAME=PulseAPK-win-x64.exe CREATE_ZIP=false ./scripts/build-windows-exe.sh

      - name: Upload Linux and Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PulseAPK-linux-windows-release-assets
          path: |
            artifacts/linux/linux-x64/PulseAPK-linux-x64.AppImage
            artifacts/windows/win-x64/publish/PulseAPK-win-x64.exe
          if-no-files-found: error

  build-macos-arm64:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Optional production signing/notarization secrets:
      # - MACOS_CODESIGN_IDENTITY: Developer ID Application certificate identity installed in the runner keychain.
      # - APPLE_ID: Apple Developer account email used by notarytool.
      # - APPLE_TEAM_ID: Apple Developer team ID.
      # - APPLE_APP_SPECIFIC_PASSWORD: App-specific password for the Apple ID.
      # If MACOS_CODESIGN_IDENTITY is omitted, the build script falls back to ad-hoc signing.
      # If all Apple notarization secrets are present, the ZIP is notarized and the ticket is stapled before upload.
      - name: Build macOS arm64 app bundle
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: RID=osx-arm64 ./scripts/build-macos-binary.sh

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseAPK-osx-arm64-release-assets
          path: artifacts/macos/osx-arm64/PulseAPK-osx-arm64.zip
          if-no-files-found: error
