name: Build draft release
run-name: PulseAPK v${{ inputs.app-version }} draft release

on:
  workflow_dispatch:
    inputs:
      app-version:
        description: "App version to stamp into the build"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pulseapk-release-${{ inputs.app-version }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate numeric release version
        shell: bash
        env:
          VERSION: ${{ inputs.app-version }}
        run: |
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error::Enter a numeric version such as 1.2.9, without a v prefix."
            exit 1
          }
      - name: Refuse existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.app-version }}
        shell: bash
        run: |
          set -euo pipefail
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name')
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          if grep -Fxq -- "$TAG" <<< "$tags" || grep -Fxq -- "$TAG" <<< "$releases"; then
            echo "::error::Tag or release $TAG already exists."
            exit 1
          fi

  build-linux-windows:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install AppImage tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file
          curl -L https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool

      - name: Build Linux AppImage
        env:
          APP_VERSION: ${{ inputs.app-version }}
        run: ./scripts/build-appimage.sh

      - name: Build Windows binaries
        env:
          APP_VERSION: ${{ inputs.app-version }}
        run: OUTPUT_EXE_NAME=PulseAPK-win-x64.exe CREATE_ZIP=false ./scripts/build-windows-exe.sh

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseAPK-linux-x64-release-asset
          path: artifacts/linux/linux-x64/PulseAPK-linux-x64.AppImage
          if-no-files-found: error

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseAPK-win-x64-release-asset
          path: artifacts/windows/win-x64/publish/PulseAPK-win-x64.exe
          if-no-files-found: error

  build-macos-arm64:
    needs: validate
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Optional production signing/notarization secrets:
      # - MACOS_CODESIGN_IDENTITY: Developer ID Application certificate identity installed in the runner keychain.
      # - APPLE_ID: Apple Developer account email used by notarytool.
      # - APPLE_TEAM_ID: Apple Developer team ID.
      # - APPLE_APP_SPECIFIC_PASSWORD: App-specific password for the Apple ID.
      # If MACOS_CODESIGN_IDENTITY is omitted, the build script falls back to ad-hoc signing.
      # If all Apple notarization secrets are present, the ZIP is notarized and the ticket is stapled before upload.
      - name: Build macOS arm64 ZIP
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APP_VERSION: ${{ inputs.app-version }}
        run: RID=osx-arm64 ./scripts/build-macos-binary.sh

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseAPK-osx-arm64-release-assets
          path: artifacts/macos/osx-arm64/PulseAPK-osx-arm64.zip
          if-no-files-found: error

  create-draft-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [build-linux-windows, build-macos-arm64]

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: PulseAPK-*-release-asset*
          path: release-assets
          merge-multiple: true

      - name: Refuse existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.app-version }}
        shell: bash
        run: |
          set -euo pipefail
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name')
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          if grep -Fxq -- "$TAG" <<< "$tags" || grep -Fxq -- "$TAG" <<< "$releases"; then
            echo "::error::Tag or release $TAG already exists."
            exit 1
          fi

      - name: Verify assets and create draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.app-version }}
          SOURCE_SHA: ${{ github.sha }}
        working-directory: release-assets
        run: |
          set -euo pipefail
          assets=(PulseAPK-linux-x64.AppImage PulseAPK-win-x64.exe PulseAPK-osx-arm64.zip)
          for asset in "${assets[@]}"; do
            test -s "$asset" || { echo "::error::Missing or empty release asset $asset"; exit 1; }
          done
          unzip -tq PulseAPK-osx-arm64.zip
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          gh release create "$TAG" "${assets[@]}" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --draft \
            --title "PulseAPK $TAG" --generate-notes
