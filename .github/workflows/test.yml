name: Release tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Release tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Select and verify .NET 8 SDK
        shell: bash
        run: |
          dotnet new globaljson --sdk-version 8.0.100 --roll-forward latestFeature
          sdk_version=$(dotnet --version)
          echo "Using SDK $sdk_version"
          [[ "$sdk_version" == 8.* ]]

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Prepare verified Android acceptance tools
        shell: python
        run: |
          import hashlib, os, pathlib, urllib.request
          directory = pathlib.Path(os.environ["RUNNER_TEMP"])
          sdk = pathlib.Path(os.environ["ANDROID_HOME"])
          paths = {"PULSE_ANDROID_BUILD_TOOLS": sdk / "build-tools/35.0.0",
                   "PULSE_ANDROID_JAR": sdk / "platforms/android-35/android.jar"}
          assets = [
              ("PULSE_APKTOOL", "iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar", "eee4669a704a14e0623407e6701b0b91887e61e1e4049cb7a82833e14ae8b5fd"),
              ("PULSE_SIGNER", "patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar", "e1299fd6fcf4da527dd53735b56127e8ea922a321128123b9c32d619bba1d835")]
          for key, asset, digest in assets:
              path = directory / asset.split("/")[-1]
              urllib.request.urlretrieve("https://github.com/" + asset, path)
              if hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  raise ValueError(f"Checksum mismatch for {path.name}")
              paths[key] = path
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for key, path in paths.items():
                  print(f"{key}={path}", file=env)

      - name: Restore dependencies
        run: dotnet restore PulseAPK.sln

      - name: Build Release
        run: dotnet build PulseAPK.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test PulseAPK.sln --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-tests-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: warn
